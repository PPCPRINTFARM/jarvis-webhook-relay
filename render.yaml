services:
  - type: web
    name: jarvis-webhook-relay
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: FLOW_TOKEN
        sync: false
      - key: QUO_KEY
        sync: false
      - key: QUO_SENDER
        value: "+16029628859"
      - key: GLEN_PHONE
        value: "+12513201372"
      - key: SHOP_TOKEN
        sync: false
      - key: SHOP_STORE
        value: electricmotorexperts.myshopify.com
      - key: DRAFT_SMS_THRESHOLD
        value: "1000"
      - key: ORDER_SMS_THRESHOLD
        value: "0"
      - key: DATABASE_URL
        fromDatabase:
          name: jarvis-hub-db
          property: connectionString

databases:
  - name: jarvis-hub-db
    plan: free
    databaseName: jarvishub
    user: jarvis
